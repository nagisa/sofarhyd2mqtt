[package]
name = "sofarhyd2mqtt"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Simonas Kazlauskas <sofarhyd@kazlauskas.me>"]

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "derive", "error-context"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
homie5 = "0.12.1"
humantime = "2.4.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rumqttc = { version = "0.25.1", features = ["url"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
flume = { version = "0.11.1", default-features = false }

[lints.clippy]
style = { level = "allow" }
correctness = { level = "deny" }
suspicious = { level = "deny" }
perf = { level = "deny" }
